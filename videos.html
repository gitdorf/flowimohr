<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos – René Hamdorf</title>
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-animated"></div>
  <div class="nav-overlay"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">RH</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="videos.html">Videos</a></li>
      <li><a href="musik.html">Musik</a></li>
      <li><a href="photos.html">Fotos</a></li>
      <li><a href="troots.html">Trööts</a></li>
      <li><a href="contact.html">Kontakt</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Menü öffnen">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <header class="page-header fade-in">
    <h1>Videos</h1>
    <p>Meine Videos auf PeerTube</p>
    <a href="https://tube.hamdorf.org/accounts/rene/videos" target="_blank" rel="noopener noreferrer" class="peertube-channel-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      Alle Videos auf PeerTube
    </a>
  </header>

  <main class="section">
    <div class="video-grid" id="video-grid">
      <div class="video-loading fade-in visible">Videos werden geladen…</div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="datenschutz.html">Datenschutzerklärung</a>
    </div>
    <p>&copy; 2026 René Hamdorf. Alle Rechte vorbehalten.</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      var API = 'https://tube.hamdorf.org/api/v1/accounts/rene/videos?count=20&sort=-publishedAt';
      var BASE = 'https://tube.hamdorf.org';
      var grid = document.getElementById('video-grid');

      fetch(API)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data.data || data.data.length === 0) {
            grid.innerHTML = '<p class="video-loading">Keine Videos gefunden.</p>';
            return;
          }
          grid.innerHTML = '';
          data.data.forEach(function (video) {
            var shortUUID = video.shortUUID;
            var thumb = video.thumbnails && video.thumbnails.length > 0
              ? video.thumbnails[0].fileUrl
              : BASE + video.thumbnailPath;
            var date = new Date(video.publishedAt).toLocaleDateString('de-DE', {
              day: 'numeric', month: 'long', year: 'numeric'
            });
            var card = document.createElement('article');
            card.className = 'video-card fade-in visible';
            card.innerHTML =
              '<div class="video-embed video-preview" data-uuid="' + shortUUID + '">' +
                '<img src="' + thumb + '" alt="Vorschaubild: ' + video.name.replace(/"/g, '&quot;') + '" class="video-consent-thumb" loading="lazy">' +
                '<div class="video-consent-overlay">' +
                  '<button class="video-consent-play" type="button" aria-label="Video abspielen">' +
                    '<svg viewBox="0 0 68 48" width="68" height="48"><path d="M34 0C15.2 0 0 15.2 0 34s15.2 34 34 34 34-15.2 34-34S52.8 0 34 0z" fill="rgba(0,0,0,0.6)"/><path d="M27 20v28l22-14z" fill="#fff"/></svg>' +
                  '</button>' +
                '</div>' +
              '</div>' +
              '<h2 class="video-title">' + video.name + '</h2>' +
              '<div class="video-date">' + date + '</div>';
            grid.appendChild(card);
          });

          grid.addEventListener('click', function (e) {
            var btn = e.target.closest('.video-consent-play');
            if (!btn) return;
            var container = btn.closest('.video-preview');
            var uuid = container.getAttribute('data-uuid');
            container.innerHTML =
              '<iframe src="' + BASE + '/videos/embed/' + uuid + '?autoplay=1&warningTitle=0" ' +
              'frameborder="0" allowfullscreen ' +
              'sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>';
            container.classList.remove('video-preview');
          });
        })
        .catch(function () {
          grid.innerHTML =
            '<p class="video-loading">Videos konnten nicht geladen werden. ' +
            '<a href="' + BASE + '/accounts/rene/videos" target="_blank" rel="noopener">Direkt auf PeerTube ansehen</a></p>';
        });
    })();
  </script>
</body>
</html>
